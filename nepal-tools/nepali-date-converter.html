    <script>
      function convertBSToAD() {
        var input = document.getElementById("bsDate").value.trim();
        var result = document.getElementById("result");
        var status = document.getElementById("status");

        try {
          if (typeof NepaliDate === "undefined") {
            throw new Error(
              "Library not loaded. Check your internet connection.",
            );
          }

          if (!/^\d{4}-\d{1,2}-\d{1,2}$/.test(input)) {
            throw new Error("Enter date as YYYY-MM-DD.");
          }

          var date = new NepaliDate(input);
          var ad = date.toJsDate();

          if (isNaN(ad.getTime())) {
            throw new Error("Invalid BS date.");
          }

          var formatted =
            ad.getFullYear() +
            "-" +
            String(ad.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(ad.getDate()).padStart(2, "0");

          result.textContent = "AD Date: " + formatted;
          status.textContent = "Conversion successful!";
          status.style.color = "green";
        } catch (error) {
          result.textContent = "Conversion failed.";
          status.textContent = error.message;
          status.style.color = "red";
        }
      }

      function convertADToBS() {
        var input = document.getElementById("adDate").value;
        var result = document.getElementById("result");
        var status = document.getElementById("status");

        try {
          if (typeof NepaliDate === "undefined") {
            throw new Error(
              "Library not loaded. Check your internet connection.",
            );
          }

          if (!input) {
            throw new Error("Please select an AD date.");
          }

          var date = new Date(input + "T12:00:00");
          var nepali = new NepaliDate(date);

          var formatted =
            nepali.getYear() +
            "-" +
            String(nepali.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(nepali.getDate()).padStart(2, "0");

          result.textContent = "BS Date: " + formatted;
          status.textContent = "Conversion successful!";
          status.style.color = "green";
        } catch (error) {
          result.textContent = "Conversion failed.";
          status.textContent = error.message;
          status.style.color = "red";
        }
      }

      function clearDates() {
        document.getElementById("bsDate").value = "";
        document.getElementById("adDate").value = "";
        document.getElementById("result").textContent =
          "Your converted date will appear here.";
        document.getElementById("status").textContent = "";
      }
    </script>
