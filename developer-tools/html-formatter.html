    <script>
      function formatHTML() {
        var input = document.getElementById("htmlInput").value.trim();
        var output = document.getElementById("htmlOutput");
        var status = document.getElementById("status");

        if (input === "") {
          status.innerHTML = "Please enter HTML code.";
          status.style.color = "red";
          return;
        }

        var lines = input.replace(/></g, ">\n<").split("\n");

        var result = "";
        var indent = 0;

        var voidTags = [
          "area",
          "base",
          "br",
          "col",
          "embed",
          "hr",
          "img",
          "input",
          "link",
          "meta",
          "source",
          "wbr",
        ];

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();

          if (line === "") continue;

          if (line.indexOf("</") === 0) {
            indent = Math.max(0, indent - 1);
          }

          result += "  ".repeat(indent) + line + "\n";

          if (
            line.charAt(0) === "<" &&
            line.indexOf("</") !== 0 &&
            line.indexOf("<!") !== 0
          ) {
            var match = line.match(/^<([a-zA-Z0-9-]+)/);
            var tag = match ? match[1].toLowerCase() : "";

            if (voidTags.indexOf(tag) === -1 && line.indexOf("/>") === -1) {
              indent++;
            }
          }
        }

        output.value = result.trim();
        status.innerHTML = "HTML formatted successfully!";
        status.style.color = "green";
      }

      function minifyHTML() {
        var input = document.getElementById("htmlInput").value;
        var output = document.getElementById("htmlOutput");
        var status = document.getElementById("status");

        if (input.trim() === "") {
          status.innerHTML = "Please enter HTML code.";
          status.style.color = "red";
          return;
        }

        output.value = input.replace(/>\s+</g, "><").trim();
        status.innerHTML = "HTML minified successfully!";
        status.style.color = "green";
      }

      function copyHTML() {
        var output = document.getElementById("htmlOutput");
        var status = document.getElementById("status");

        if (output.value === "") {
          status.innerHTML = "Nothing to copy.";
          status.style.color = "red";
          return;
        }

        output.select();
        document.execCommand("copy");

        status.innerHTML = "HTML copied!";
        status.style.color = "green";
      }

      function clearHTML() {
        document.getElementById("htmlInput").value = "";
        document.getElementById("htmlOutput").value = "";
        document.getElementById("status").innerHTML = "";
      }
    </script>
