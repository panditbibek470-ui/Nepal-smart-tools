<html lang="en">

    <link rel="stylesheet" href="../assets/css/style.css" />

    <style>
      .tool-box {

        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 15px;

      }

      .actions {
        display: flex;

        cursor: pointer;
      }

      .actions button:hover {
        background: #06449a;
      }

      #status {
        font-weight: bold;
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="container navbar">
        <a href="../index.html" class="logo">🇳🇵 Nepal Smart Tools</a>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Developer Tools</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="tool-box">
        <h1>Base64 Converter</h1>
        <p>Encode normal text into Base64 or decode Base64 back into text.</p>

        <h3>Enter Your Text</h3>

        <textarea
          id="inputText"
          placeholder="Enter text or Base64 here..."
        ></textarea>

        <div class="actions">
          <button onclick="encodeText()">Encode Base64</button>
          <button onclick="decodeText()">Decode Base64</button>
          <button onclick="copyResult()">Copy Result</button>
          <button onclick="clearText()">Clear</button>
        </div>

        <h3>Result</h3>

        <textarea
          id="outputText"
          placeholder="Your result will appear here..."
          readonly
        ></textarea>

        <p id="status"></p>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 Nepal Smart Tools. All rights reserved.</p>
      </div>
    </footer>

    <script>
      function encodeText() {
        var input = document.getElementById("inputText").value;
        var output = document.getElementById("outputText");
        var status = document.getElementById("status");

        if (input === "") {
          status.innerHTML = "Please enter some text.";
          status.style.color = "red";
          return;
        }

        try {
          var bytes = new TextEncoder().encode(input);
          var binary = "";

          for (var i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }

          output.value = btoa(binary);
          status.innerHTML = "Text encoded successfully!";
          status.style.color = "green";
        } catch (error) {
          status.innerHTML = "Encoding failed.";
          status.style.color = "red";
        }
      }

      function decodeText() {
        var input = document.getElementById("inputText").value.trim();
        var output = document.getElementById("outputText");
        var status = document.getElementById("status");

        if (input === "") {
          status.innerHTML = "Please enter Base64 text.";
          status.style.color = "red";
          return;
        }

        try {
          var binary = atob(input);
          var bytes = new Uint8Array(binary.length);

          for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }

          output.value = new TextDecoder("utf-8", { fatal: true }).decode(
            bytes,
          );
          status.innerHTML = "Base64 decoded successfully!";
          status.style.color = "green";
        } catch (error) {
          status.innerHTML = "Invalid Base64 or unsupported text encoding.";
          status.style.color = "red";
        }
      }

      function copyResult() {
        var output = document.getElementById("outputText");
        var status = document.getElementById("status");

        if (output.value === "") {
          status.innerHTML = "Nothing to copy.";
          status.style.color = "red";
          return;
        }

        output.select();
        document.execCommand("copy");

        status.innerHTML = "Result copied!";
        status.style.color = "green";
      }

      function clearText() {
        document.getElementById("inputText").value = "";
        document.getElementById("outputText").value = "";
        document.getElementById("status").innerHTML = "";
      }
    </script>
  </body>
</html>
