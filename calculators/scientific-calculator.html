      ```html
      <div class="buttons">
        <button onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="append('(')">(</button>
        <button onclick="append(')')">)</button>

        <button onclick="scientific('sin')">sin</button>
        <button onclick="scientific('cos')">cos</button>
        <button onclick="scientific('tan')">tan</button>
        <button onclick="append('/')">÷</button>

        <button onclick="scientific('sqrt')">√</button>
        <button onclick="scientific('log')">log</button>
        <button onclick="scientific('ln')">ln</button>
        <button onclick="append('*')">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('-')">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('+')">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('^')">xʸ</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="append('pi')">π</button>
        <button onclick="append('e')">e</button>

        <button onclick="append('%')">%</button>
        <button onclick="append('!')">n!</button>
        <button onclick="append('00')">00</button>
        <button onclick="calculate()">=</button>

    <script>
      const display = document.getElementById("display");

      function append(value) {
        if (display.value === "Error") display.value = "";
        display.value += value;
      }

      function clearDisplay() {
        display.value = "";
      }

      function deleteLast() {
        display.value = display.value.slice(0, -1);
      }

      function scientific(type) {
        const value = display.value;
        if (!value) return;

        display.value +=
          type === "sqrt"
            ? "sqrt("
            : type === "sin"
              ? "sin("
              : type === "cos"
                ? "cos("
                : type === "tan"
                  ? "tan("
                  : type === "log"
                    ? "log("
                    : "ln(";
      }

      function calculate() {
        try {
          let expression = display.value;

          expression = expression.replace(/pi/g, "Math.PI");
          expression = expression.replace(/\be\b/g, "Math.E");
          expression = expression.replace(/\^/g, "**");
          expression = expression.replace(/sqrt\(/g, "Math.sqrt(");
          expression = expression.replace(/sin\(/g, "Math.sin(Math.PI/180*(");
          expression = expression.replace(/cos\(/g, "Math.cos(Math.PI/180*(");
          expression = expression.replace(/tan\(/g, "Math.tan(Math.PI/180*(");
          expression = expression.replace(/log\(/g, "Math.log10(");
          expression = expression.replace(/ln\(/g, "Math.log(");

          if (!/^[0-9+\-*/().%!<>=\sA-Za-z]*$/.test(expression)) {
            throw new Error("Invalid input");
          }

          if (expression.includes("!")) {
            expression = expression.replace(/(\d+(?:\.\d+)?)!/g, (_, n) => {
              let number = Number(n);
              if (!Number.isInteger(number) || number < 0 || number > 170) {
                throw new Error("Invalid factorial");
              }
              let result = 1;
              for (let i = 2; i <= number; i++) result *= i;
              return result;
            });
          }

          if (expression.includes("%")) {
            expression = expression.replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");
          }

          const result = Function(
            '"use strict"; return (' + expression + ")",
          )();

          if (!Number.isFinite(result)) {
            throw new Error("Invalid result");
          }

          display.value = Number(result.toFixed(10)).toString();
        } catch (error) {
          display.value = "Error";
        }
      }
    </script>
