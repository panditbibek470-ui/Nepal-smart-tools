    <script>
      function changeCalendar() {
        const type = document.getElementById("calendarType").value;

        document.getElementById("bsInput").style.display =
          type === "BS" ? "block" : "none";

        document.getElementById("adInput").style.display =
          type === "AD" ? "block" : "none";

        document.getElementById("result").style.display = "none";
        document.getElementById("error").style.display = "none";
      }

      function showError(message) {
        const error = document.getElementById("error");
        error.textContent = message;
        error.style.display = "block";
        document.getElementById("result").style.display = "none";
      }

      function calculateAge() {
        const type = document.getElementById("calendarType").value;
        let birth;

        try {
          if (typeof NepaliPatro === "undefined") {
            showError(
              "Date conversion library could not load. Check your internet connection and refresh.",
            );
            return;
          }

          if (type === "BS") {
            const year = Number(document.getElementById("bsYear").value);
            const month = Number(document.getElementById("bsMonth").value);
            const day = Number(document.getElementById("bsDay").value);

            if (!year || !month || !day) {
              showError("Please enter your complete BS date.");
              return;
            }

            if (month < 1 || month > 12) {
              showError("Please enter a valid BS month (1–12).");
              return;
            }

            const daysInMonth = NepaliPatro.getDaysInMonth(year, month);

            if (!daysInMonth || day < 1 || day > daysInMonth) {
              showError(
                "Invalid BS date. Please check the year, month and day.",
              );
              return;
            }

            birth = NepaliPatro.convertBSToAD({
              year: year,
              month: month,
              day: day,
            });
          } else {
            const value = document.getElementById("birthDate").value;

            if (!value) {
              showError("Please select your AD date of birth.");
              return;
            }

            const parts = value.split("-").map(Number);
            birth = new Date(parts[0], parts[1] - 1, parts[2]);

            if (
              birth.getFullYear() !== parts[0] ||
              birth.getMonth() !== parts[1] - 1 ||
              birth.getDate() !== parts[2]
            ) {
              showError("Please enter a valid AD date.");
              return;
            }
          }
        } catch (error) {
          showError(
            "Unable to convert this date. Please check the date and try again.",
          );
          return;
        }

        if (!(birth instanceof Date) || isNaN(birth.getTime())) {
          showError("Invalid birth date. Please try again.");
          return;
        }

        birth = new Date(
          birth.getFullYear(),
          birth.getMonth(),
          birth.getDate(),
        );

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (birth > today) {
          showError("Date of birth cannot be in the future.");
          return;
        }

        let years = today.getFullYear() - birth.getFullYear();
        let months = today.getMonth() - birth.getMonth();
        let days = today.getDate() - birth.getDate();

        if (days < 0) {
          months--;

          const previousMonthDays = new Date(
            today.getFullYear(),
            today.getMonth(),
            0,
          ).getDate();

          days += previousMonthDays;
        }

        if (months < 0) {
          years--;
          months += 12;
        }

        const millisecondsPerDay = 86400000;

        const totalDays = Math.round(
          (Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) -
            Date.UTC(birth.getFullYear(), birth.getMonth(), birth.getDate())) /
            millisecondsPerDay,
        );

        let nextBirthday = new Date(
          today.getFullYear(),
          birth.getMonth(),
          birth.getDate(),
        );

        if (nextBirthday <= today) {
          nextBirthday = new Date(
            today.getFullYear() + 1,
            birth.getMonth(),
            birth.getDate(),
          );
        }

        const daysUntilBirthday = Math.round(
          (Date.UTC(
            nextBirthday.getFullYear(),
            nextBirthday.getMonth(),
            nextBirthday.getDate(),
          ) -
            Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) /
            millisecondsPerDay,
        );

        document.getElementById("ageText").textContent =
          years + " Years, " + months + " Months, " + days + " Days";

        document.getElementById("birthAD").textContent =
          "Birth date in AD: " + birth.toLocaleDateString("en-GB");

        document.getElementById("totalDays").textContent =
          "Total days lived: " + totalDays.toLocaleString();

        document.getElementById("nextBirthday").textContent =
          "Days until next birthday: " + daysUntilBirthday;

        document.getElementById("error").style.display = "none";
        document.getElementById("result").style.display = "block";
      }

      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
  </body>
