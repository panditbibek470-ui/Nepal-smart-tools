```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert images online between JPG, PNG and WebP formats for free."
    />
    <title>Image Converter - Nepal Smart Tools</title>
    <link rel="stylesheet" href="../assets/css/style.css" />

    <style>
      .converter {
        max-width: 650px;
        margin: 35px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      }

      .converter input,
      .converter select {
        width: 100%;
        padding: 12px;
        margin: 10px 0 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .converter button,
      .download-link {
        display: inline-block;
        padding: 12px 20px;
        background: #1769e0;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        margin-top: 12px;
      }

      .preview {
        max-width: 100%;
        max-height: 300px;
        display: none;
        margin: 15px auto;
      }

      #result {
        margin-top: 20px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container navbar">
        <a href="../index.html" class="logo">🇳🇵 Nepal Smart Tools</a>
        <nav>
          <a href="../index.html">Home</a>
          <a href="index.html">Image Tools</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>🔄 Image Converter</h1>
        <p>Convert your images into JPG, PNG or WebP format.</p>
      </section>

      <section class="converter">
        <h2>Convert Your Image</h2>

        <label for="imageInput">Choose an image:</label>
        <input type="file" id="imageInput" accept="image/*" />

        <img id="preview" class="preview" alt="Image preview" />

        <label for="format">Choose Output Format:</label>
        <select id="format">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>

        <button id="convertButton">Convert Image</button>

        <div id="result"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 Nepal Smart Tools. All rights reserved.</p>
      </div>
    </footer>

    <script>
      const imageInput = document.getElementById("imageInput");
      const preview = document.getElementById("preview");
      const format = document.getElementById("format");
      const convertButton = document.getElementById("convertButton");
      const result = document.getElementById("result");

      let selectedImage = null;
      let downloadUrl = null;

      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/") || file.type === "image/svg+xml") {
          alert("Please choose a supported image file.");
          imageInput.value = "";
          return;
        }

        selectedImage = file;

        const reader = new FileReader();

        reader.onload = (event) => {
          preview.src = event.target.result;
          preview.style.display = "block";
          result.innerHTML = "";
        };

        reader.readAsDataURL(file);

        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = null;
      });

      convertButton.addEventListener("click", () => {
        if (!selectedImage) {
          alert("Please choose an image first.");
          return;
        }

        const img = new Image();

        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;

          const ctx = canvas.getContext("2d");
          const selectedFormat = format.value;

          if (selectedFormat === "image/jpeg") {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          ctx.drawImage(img, 0, 0);

          canvas.toBlob(
            (blob) => {
              if (!blob) {
                result.textContent =
                  "Conversion failed. Please try another format.";
                return;
              }

              // Some browsers may not support a requested output format.
              if (blob.type !== selectedFormat) {
                result.textContent =
                  "This output format is not supported by your browser.";
                return;
              }

              if (downloadUrl) URL.revokeObjectURL(downloadUrl);
              downloadUrl = URL.createObjectURL(blob);

              const extension =
                selectedFormat === "image/jpeg"
                  ? "jpg"
                  : selectedFormat === "image/png"
                    ? "png"
                    : "webp";

              const fileName = selectedImage.name.replace(/\.[^/.]+$/, "");

              result.innerHTML = `
                    <h3>Image Converted Successfully!</h3>
                    <p>Original format: ${selectedImage.type || "Unknown"}</p>
                    <p>New format: ${extension.toUpperCase()}</p>
                    <p>New file size: ${(blob.size / 1024).toFixed(2)} KB</p>

                    <a class="download-link"
                       href="${downloadUrl}"
                       download="${fileName}-converted.${extension}">
                       Download Converted Image
                    </a>
                `;
            },
            selectedFormat,
            0.92,
          );
        };

        img.onerror = () => {
          result.textContent =
            "Could not load this image. Please choose another file.";
        };

        img.src = URL.createObjectURL(selectedImage);
      });
    </script>
  </body>
</html>
